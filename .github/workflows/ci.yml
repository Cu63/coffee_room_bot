name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # dev — группа зависимостей (dependency-groups), uv ставит её по умолчанию
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scorebot
          POSTGRES_PASSWORD: scorebot
          POSTGRES_DB: scorebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scorebot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Миграции применяет фикстура тестов; БД и Redis очищаются перед каждым тестом
      TEST_DATABASE_URL: postgresql://scorebot:scorebot@localhost:5432/scorebot_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/integration -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Тот же образ, что соберёт деплой: если он не собирается, на сервер коммит не попадёт
      - run: docker build -t coffee-room-bot:ci .
      - name: Образ запускается не от root, код и зависимости импортируются
        run: |
          test "$(docker run --rm --entrypoint id coffee-room-bot:ci -u)" = "10001"
          docker run --rm --entrypoint .venv/bin/python coffee-room-bot:ci -c "import bot.main"
          docker run --rm --entrypoint sh coffee-room-bot:ci -c "ls bot/__pycache__/*.opt-2.pyc > /dev/null"
      - name: Без пульса бота healthcheck не проходит
        run: "! docker run --rm --entrypoint .venv/bin/python coffee-room-bot:ci -m bot.infrastructure.heartbeat"
